name: Waypoint review checks

on:
  push:
    branches:
      - waypoint-content-safety-accuracy
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  review-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout review branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply dependency audit fixes to the review branch
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        run: |
          pnpm audit --fix || true
          if ! git diff --quiet -- package.json pnpm-lock.yaml; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package.json pnpm-lock.yaml
            git commit -m "security: apply dependency audit fixes"
            git push origin HEAD:${{ github.event.pull_request.head.ref }}
          fi

      - name: TypeScript check
        run: pnpm exec tsc --noEmit

      - name: Dependency security audit
        run: pnpm audit --audit-level=high
