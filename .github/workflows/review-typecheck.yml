name: Waypoint review checks

on:
  push:
    branches:
      - main
      - 'waypoint/**'
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: review-checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  review-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Policy and authorization tests
        run: pnpm test

      - name: TypeScript check
        run: pnpm exec tsc --noEmit

      - name: Production build check
        run: pnpm build
        env:
          NEON_DATABASE_URL: postgresql://waypoint_ci:waypoint_ci@localhost:5432/waypoint_ci
          JWT_SECRET: waypoint-ci-only-jwt-secret-not-for-production-2026

      - name: Dependency security audit
        run: pnpm audit --audit-level=high
