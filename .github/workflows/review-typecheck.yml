name: Waypoint review checks

on:
  push:
    branches:
      - waypoint-content-safety-accuracy
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  review-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout review branch
        uses: actions/checkout@v4
        with:
          ref: waypoint-content-safety-accuracy

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Regenerate lockfile for current overrides
        run: pnpm install --no-frozen-lockfile

      - name: Commit regenerated lockfile if needed
        if: github.event_name == 'push'
        run: |
          if ! git diff --quiet -- pnpm-lock.yaml; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add pnpm-lock.yaml
            git commit -m "security: sync dependency lockfile"
            git push origin HEAD:waypoint-content-safety-accuracy
          fi

      - name: TypeScript check
        run: pnpm exec tsc --noEmit

      - name: Dependency security audit
        run: pnpm audit --audit-level=high
