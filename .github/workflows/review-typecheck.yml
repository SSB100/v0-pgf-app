name: Apply Daily Reflection copy

on:
  push:
    branches:
      - copy/daily-reflections-language

permissions:
  contents: write

concurrency:
  group: daily-reflection-copy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apply-copy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout source branch
        uses: actions/checkout@v4
        with:
          ref: copy/daily-reflections-language
          fetch-depth: 1

      - name: Apply terminology and dashboard copy changes
        run: python scripts/apply-daily-reflections-copy.py

      - name: Restore normal review workflow and commit
        run: |
          git fetch origin main --depth=1
          git show origin/main:.github/workflows/review-typecheck.yml > .github/workflows/review-typecheck.yml
          rm scripts/apply-daily-reflections-copy.py
          git config user.name "SSB"
          git config user.email "solanasportsbetting@gmail.com"
          git add app components lib .github/workflows/review-typecheck.yml scripts/apply-daily-reflections-copy.py
          git diff --cached --stat
          git commit -m "Adopt Daily Reflections terminology"
          git push origin HEAD:copy/daily-reflections-language
